[package]
name = "ameath-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = { version = "0.29.15", features = ["rwh_05"] }
softbuffer = "0.4.1"
raw-window-handle = "0.5.2"
image = "0.24"
rand = "0.8"
windows = { version = "0.52", features = ["Win32_Foundation", "Foundation_Numerics", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Security"] }
rusttype = "0.9.3"
rodio = "0.19"
lofty = "0.21"
rfd = "0.15"
tray-icon = "0.19.2"
global-hotkey = "0.5.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
arboard = "3"
clipboard-win = "5"
async-trait = "0.1.89"
sysinfo = "0.38.1"
lz4_flex = "0.11"
rayon = "1.10"
lru = "0.12"
base64 = "0.22.1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true           # Link Time Optimization
codegen-units = 1    # More optimization
panic = "abort"      # Reduce binary size
strip = true         # Strip symbols
